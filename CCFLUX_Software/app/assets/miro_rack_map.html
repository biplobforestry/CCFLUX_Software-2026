<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CC-FLUX &middot; MIRO Rack Mapview</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root{--ink:#eaf7ff;--muted:#a9c8d5;--panel:#0b2233;--line:#24475a;--cyan:#35d5ff;--green:#42d99b}
    *{box-sizing:border-box}html{font-size:clamp(16px,calc(12px + .30vw),20px)}html,body{height:100%;margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;background:#06131f;color:var(--ink)}
    body{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}
    header{display:flex;align-items:center;gap:20px;padding:12px 24px;background:#071827;border-bottom:1px solid var(--line);box-shadow:0 4px 18px #00101855}
    header .brand-logo{display:block;width:137px;height:98px;border:0;background:transparent;object-fit:contain;max-width:none;flex:0 0 137px;filter:drop-shadow(0 7px 10px rgba(0,0,0,.38)) drop-shadow(0 0 8px rgba(25,200,255,.10))}
    .brand{display:flex;align-items:center;gap:18px;min-width:0}.brand div{display:grid;gap:6px;min-width:0}
    header strong{font-size:clamp(1.55rem,1.9vw,2.25rem);line-height:1.08;font-weight:800;color:var(--cyan);letter-spacing:.01em;white-space:nowrap}
    header span{color:var(--muted);font-size:clamp(.9rem,.94vw,1.08rem);line-height:1.35}
    .toolbar{display:grid;grid-template-columns:repeat(4,minmax(300px,1fr)) auto;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:stretch}
    .selection{display:grid;grid-template-columns:56px minmax(92px,1fr) minmax(108px,1fr);gap:7px;align-items:end;padding:9px;border:1px solid var(--line);border-radius:9px;background:#081a28}
    label{font-size:.82rem;color:var(--muted);display:grid;gap:4px;font-weight:700;min-width:0}select,input,button{border:1px solid #376077;border-radius:7px;background:#0d2a3c;color:var(--ink);padding:7px;min-width:0}
    /* The investigation filter is one interval for every layer, so it gets its
       own two-column cell rather than the per-layer three-column grid. */
    .selection.investigation{grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);border-color:#3f7fa4}
    .selection.investigation input[type="text"]{width:100%;height:36px}
    .selection.investigation button{grid-column:auto}
    .investigation-note{grid-column:1/-1;color:var(--muted);font-size:.8rem}
    select,.selection input[type="number"]{width:100%;height:36px}.selection input[type="checkbox"]{width:18px;height:18px;margin:4px 0 8px}.show-control{justify-items:start}.layer-width{max-width:74px}
    button{height:42px;font-weight:800;cursor:pointer;padding:9px 14px}button.primary{background:linear-gradient(135deg,#087f78,#159447);border-color:#31b59f}button.secondary{background:#102f42;border-color:#4f7f96}
    /* In the header, not the toolbar: these three act on the whole map rather
       than on one layer, and the toolbar's four layer cells pushed them to the
       bottom of a tall grid, far from anything they change. */
    .map-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
    .map-actions button{white-space:nowrap}
    .map-actions button[aria-pressed="true"]{border-color:#77e1ce;color:#8cf1df;box-shadow:0 0 0 1px #1ba89266 inset}
    main{position:relative;min-height:420px}#map{height:100%;width:100%}
    #message{position:absolute;z-index:800;left:50%;top:18px;transform:translateX(-50%);padding:10px 15px;border-radius:9px;background:#071827ed;border:1px solid var(--line);display:none;box-shadow:0 8px 30px #0008}
    #resetMapPosition{position:absolute;z-index:900;right:14px;top:14px;height:42px;padding:8px 13px;background:#071827eb;border-color:#63cddd;box-shadow:0 8px 26px #0007;display:flex;align-items:center;gap:8px}
    #resetMapPosition:hover,#resetMapPosition:focus-visible{background:#10354a;border-color:#8cecff;outline:none}
    #resetMapPosition .reset-icon{font-size:1.15rem;line-height:1}
    #legends{position:absolute;z-index:700;right:14px;top:68px;display:grid;gap:8px;max-height:calc(100% - 82px);overflow:auto}
    .legend{width:282px;padding:12px 13px;background:#071827eb;border:1px solid #41687c;border-radius:9px;box-shadow:0 8px 26px #0007}
    .legend-head{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:800}.gradient{height:11px;border-radius:8px;margin:7px 0 4px}.range{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.legend-scale{color:var(--cyan);font-size:12px;font-weight:700;margin-top:4px}
    #mapBusyDialog{position:fixed;inset:auto;border:1px solid #3f7189;border-radius:14px;background:#071827f5;color:var(--ink);padding:0;box-shadow:0 20px 60px #000a;z-index:2000}
    #mapBusyDialog::backdrop{background:transparent}.busy-card{display:grid;grid-template-columns:auto 1fr;gap:13px 16px;align-items:center;min-width:min(440px,calc(100vw - 34px));padding:19px 22px}.busy-card strong{font-size:1.08rem;color:#fff}.busy-card span{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
    .spinner{width:34px;height:34px;border:4px solid #24475a;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .app-version{opacity:.85;font-weight:600;letter-spacing:.02em}
    footer{text-align:center;padding:11px;background:#071827;border-top:1px solid var(--line);font-weight:700}
    @media(max-width:1500px){.toolbar{grid-template-columns:repeat(2,minmax(330px,1fr))}}
    /* Narrow enough that the brand and the buttons cannot share a line: wrap
       them onto their own row rather than squeezing the title. */
    @media(max-width:1100px){header{flex-wrap:wrap}.map-actions{margin-left:0;width:100%;justify-content:flex-start}}
    @media(max-width:820px){.toolbar{grid-template-columns:1fr}.map-actions button{flex:1 1 auto}.selection{grid-template-columns:56px minmax(100px,1fr) minmax(116px,1fr)}header{padding:10px 14px}header .brand-logo{width:132px;height:72px;flex-basis:132px}.brand{align-items:center}header strong{white-space:normal}}
  </style>
</head>
<body>
  <header><div class="brand"><img class="brand-logo" src="/campaign-main-airship.svg" alt="CC-FLUX 2026 airship logo"><div><strong>CC-FLUX Campaign 2026</strong><span>Integrated Post-Flight Scientific Payload Review &middot; MIRO Rack Mapview</span></div></div>
    <div class="map-actions" aria-label="Map actions">
      <button id="flightTrackToggle" class="secondary" type="button" aria-pressed="true">Flight track: Enabled</button>
      <button id="exportMap" class="secondary" type="button">Export current map PDF</button>
      <button id="update" class="primary" type="button">Refresh and update map</button>
    </div>
  </header>
  <section class="toolbar" aria-label="Trace gas layer controls">
    <div class="selection" data-layer="1"><label class="show-control"><span>Show</span><input class="enabled" type="checkbox" checked></label><label>Instrument<select class="instrument"><option>MIRO</option><option>Picarro</option></select></label><label>Trace gas<select class="gas"></select></label><label>Width [px]<input class="layer-width" type="number" min="1" max="16" step="1" value="5"></label><label title="Visual lateral track separation; saved coordinates are unchanged">Offset [m]<input class="layer-offset" type="number" min="-100" max="100" step="1" value="0"></label><label class="show-control" title="Colour the layer on a logarithmic scale, for a gas whose values span orders of magnitude"><span>Log</span><input class="logscale" type="checkbox"></label><label>Colour scale<select class="palette"><option value="default" selected>Default</option><option value="cool">cool</option><option value="YlOrRd">YlOrRd</option><option value="viridis">viridis</option><option value="plasma">plasma</option></select></label></div>
    <div class="selection" data-layer="2"><label class="show-control"><span>Show</span><input class="enabled" type="checkbox"></label><label>Instrument<select class="instrument"><option>MIRO</option><option>Picarro</option></select></label><label>Trace gas<select class="gas"></select></label><label>Width [px]<input class="layer-width" type="number" min="1" max="16" step="1" value="5"></label><label title="Visual lateral track separation; saved coordinates are unchanged">Offset [m]<input class="layer-offset" type="number" min="-100" max="100" step="1" value="6"></label><label class="show-control" title="Colour the layer on a logarithmic scale, for a gas whose values span orders of magnitude"><span>Log</span><input class="logscale" type="checkbox"></label><label>Colour scale<select class="palette"><option value="default" selected>Default</option><option value="cool">cool</option><option value="YlOrRd">YlOrRd</option><option value="viridis">viridis</option><option value="plasma">plasma</option></select></label></div>
    <div class="selection" data-layer="3"><label class="show-control"><span>Show</span><input class="enabled" type="checkbox"></label><label>Instrument<select class="instrument"><option>MIRO</option><option>Picarro</option></select></label><label>Trace gas<select class="gas"></select></label><label>Width [px]<input class="layer-width" type="number" min="1" max="16" step="1" value="5"></label><label title="Visual lateral track separation; saved coordinates are unchanged">Offset [m]<input class="layer-offset" type="number" min="-100" max="100" step="1" value="12"></label><label class="show-control" title="Colour the layer on a logarithmic scale, for a gas whose values span orders of magnitude"><span>Log</span><input class="logscale" type="checkbox"></label><label>Colour scale<select class="palette"><option value="default" selected>Default</option><option value="cool">cool</option><option value="YlOrRd">YlOrRd</option><option value="viridis">viridis</option><option value="plasma">plasma</option></select></label></div>
    <div class="selection" data-layer="4"><label class="show-control"><span>Show</span><input class="enabled" type="checkbox"></label><label>Instrument<select class="instrument"><option>MIRO</option><option>Picarro</option></select></label><label>Trace gas<select class="gas"></select></label><label>Width [px]<input class="layer-width" type="number" min="1" max="16" step="1" value="5"></label><label title="Visual lateral track separation; saved coordinates are unchanged">Offset [m]<input class="layer-offset" type="number" min="-100" max="100" step="1" value="18"></label><label class="show-control" title="Colour the layer on a logarithmic scale, for a gas whose values span orders of magnitude"><span>Log</span><input class="logscale" type="checkbox"></label><label>Colour scale<select class="palette"><option value="default" selected>Default</option><option value="cool">cool</option><option value="YlOrRd">YlOrRd</option><option value="viridis">viridis</option><option value="plasma">plasma</option></select></label></div>
    <div class="selection investigation" data-layer="filter" aria-label="Investigation time filter">
      <label>Investigation start (UTC)<input id="investigationStart" type="text" placeholder="2026-08-03 11:30:00"></label>
      <label>Investigation end (UTC)<input id="investigationEnd" type="text" placeholder="2026-08-03 12:30:00"></label>
      <button id="investigationApply" class="primary" type="button" title="Show only the samples recorded inside this interval, for every instrument">Update</button>
      <button id="investigationClear" class="secondary" type="button" title="Show the whole recorded interval again">Whole flight</button>
      <span id="investigationNote" class="investigation-note"></span>
    </div>
  </section>
  <main><div id="map"></div><button id="resetMapPosition" type="button" title="Restore the map to the current flight-track extent" aria-label="Reset map position"><span class="reset-icon" aria-hidden="true">&#8634;</span><span>Reset map position</span></button><div id="message" role="alert"></div><div id="legends"></div></main>
  <dialog id="mapBusyDialog" aria-live="polite"><div class="busy-card"><div class="spinner" aria-hidden="true"></div><div><strong id="mapBusyTitle">Updating map</strong><span id="mapBusyMessage">Please wait while the selected map layers are refreshed.</span></div></div></dialog>
  <footer>&copy; 2026 Biplob Dey &middot; Forschungszentrum J&uuml;lich GmbH &middot; <span class="app-version">Version 1.0.2</span></footer>
  <script src="/miro_rack/map.js"></script>
</body>
</html>
