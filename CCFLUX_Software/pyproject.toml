[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ccflux-zeppelin"
version = "1.0.2"
description = "Modular skeleton for CCFLUX Zeppelin post-flight review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0,<7",
    "Flask>=3.0,<4",
    "plotly>=5.20,<7",
    "openpyxl>=3.1",
    "cryptography>=42",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]
test = ["pytest>=8,<9"]
noseboom = ["numpy>=1.24", "pandas>=2.0", "pillow>=10.0", "tables>=3.8", "matplotlib>=3.7", "openpyxl>=3.1"]
miro = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
partector = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]
ins-gimbal = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
sif = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]
micasense = ["pillow>=10.0"]
flir = ["pillow>=10.0"]
gopro = ["pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "instruments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
